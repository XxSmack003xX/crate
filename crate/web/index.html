<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crate</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23e8a33d'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23181410'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f5f0e8; --bg2: #ece5d9; --card: #fffaf2; --line: #ddd3c3;
  --ink: #241d16; --muted: #7a6d5f; --accent: #c7801c; --accent-ink: #fff;
  --have: #2f8a4c; --active: #c7801c; --search: #3b6fb6; --queued: #7a5bb5;
  --bad: #b8483a; --skip: #9b8f82;
  --shadow: 0 1px 2px rgba(40,30,20,.06), 0 4px 16px rgba(40,30,20,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14110e; --bg2: #1c1814; --card: #211c17; --line: #342c24;
    --ink: #efe6da; --muted: #9b8f82; --accent: #e8a33d; --accent-ink: #1a140d;
    --have: #5cc27f; --active: #e8a33d; --search: #6ea2ec; --queued: #a98be0;
    --bad: #e2705f; --skip: #6f655b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }

/* header */
header { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar { max-width: 1180px; margin: 0 auto; padding: 0 16px; height: 58px; display: flex; align-items: center; gap: 20px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.02em; font-size: 19px; text-decoration: none; }
.disc { width: 24px; height: 24px; border-radius: 50%; background:
  radial-gradient(circle, var(--bg) 0 3px, var(--accent) 3.5px 5px, #1b1611 5.5px 100%);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
nav { display: flex; gap: 2px; }
nav a { white-space: nowrap; text-decoration: none; padding: 7px 12px; border-radius: 8px; color: var(--muted); font-weight: 550; font-size: 14px; }
nav a:hover { color: var(--ink); background: var(--bg2); }
nav a.on { color: var(--ink); background: var(--bg2); }
nav .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px;
  background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; text-align: center; line-height: 18px; }
.conn { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted);
  max-width: 340px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--skip); flex: none; }
.dot.ok { background: var(--have); box-shadow: 0 0 0 3px color-mix(in srgb, var(--have) 25%, transparent); }
.dot.bad { background: var(--bad); }

main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 80px; }
h1 { font-size: 28px; letter-spacing: -.02em; margin: 0; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 28px 0 12px; font-weight: 700; }
.sub { color: var(--muted); }

.btn { text-decoration: none; display: inline-block; border: 1px solid var(--line); background: var(--card); padding: 7px 13px; border-radius: 8px; cursor: pointer;
  font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--bg2); }
.btn.danger:hover { color: var(--bad); border-color: var(--bad); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: default; }

.banner { background: color-mix(in srgb, var(--accent) 14%, var(--card)); border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line));
  padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; display: flex; gap: 12px; align-items: center; }
.banner.bad { background: color-mix(in srgb, var(--bad) 12%, var(--card)); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }

/* add artist search */
.addbox { position: relative; margin: 18px 0 8px; }
.addbox input { width: 100%; padding: 14px 16px 14px 44px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); font-size: 16px; box-shadow: var(--shadow); outline: none; }
.addbox input:focus { border-color: var(--accent); }
.addbox svg { position: absolute; left: 15px; top: 15px; color: var(--muted); }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; z-index: 10; max-height: 60vh; overflow-y: auto; }
.result { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--line); }
.result:first-child { border-top: 0; }
.result .meta { flex: 1; min-width: 0; }
.result .name { font-weight: 650; }
.result .desc, .result .known { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result .known { font-size: 12.5px; margin-top: 2px; }
.result .known b { color: var(--ink); font-weight: 550; }
.result .cover { width: 64px; flex: none; border-radius: 8px; box-shadow: none; }
.result .cover .ph { font-size: 18px; }
.cover.loading .ph { animation: pulse 1.2s infinite; }
.cover img.photo { object-position: 50% 22%; }
.cover .src { position: absolute; left: 0; right: 0; bottom: 0; font-size: 9.5px; font-weight: 700; letter-spacing: .04em;
  text-transform: uppercase; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.65)); padding: 8px 2px 3px; text-align: center; z-index: 1; white-space: nowrap; }
.result .cover .src { font-size: 8.5px; letter-spacing: .02em; }
.empty { padding: 18px; color: var(--muted); text-align: center; }
.addopts { display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 2px 0 6px; }
.addopts label { display: flex; align-items: center; gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: none; padding: 5px 12px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--bg2); color: var(--ink); }
.sel { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-size: 13px; max-width: 100%; }
.gridbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 22px 0 14px; }
.gridbar input { flex: 1 1 180px; max-width: 320px; min-width: 0; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); outline: none; font-size: 14px; }
.gridbar input:focus { border-color: var(--accent); }
.gridbar .n { color: var(--muted); font-size: 13px; margin-left: auto; }
.more { display: flex; justify-content: center; margin: 24px 0 8px; }
.result .cover.sq { border-radius: 6px; }
.chip { display: inline-block; font-size: 11.5px; font-weight: 650; padding: 2px 8px; border-radius: 99px; background: var(--bg2); color: var(--muted); vertical-align: middle; }
.rules { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px 16px 14px; margin-top: 18px; }
.rules .field { grid-template-columns: 190px 1fr; }
.rules .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; padding-top: 7px; font-size: 14px; }
.rules .checks label { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
@media (max-width: 720px) { .rules .field { grid-template-columns: 1fr; } .rules .field .hint { grid-column: 1; } .rules .field label { padding-top: 0; } }
.rules .foot { display: flex; gap: 8px; justify-content: flex-end; padding-top: 8px; flex-wrap: wrap; }

/* artist grid */
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.toolbar .grow { flex: 1; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 18px; }
.acard { text-decoration: none; display: block; }
.cover { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--bg2);
  box-shadow: var(--shadow); }
.cover .ph { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 34px;
  color: rgba(255,255,255,.85); letter-spacing: -.03em; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.acard:hover .cover { transform: translateY(-2px); transition: transform .15s; }
.acard .name { font-weight: 700; margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acard .stat { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.meter { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 7px; }
.meter i { display: block; height: 100%; background: var(--have); border-radius: 2px; transition: width .4s; }
.meter.dl i { background: var(--active); }
.rcard { display: flex; flex-direction: column; min-width: 0; }
.rcard > a { text-decoration: none; color: inherit; }
.rcard .name { font-weight: 700; margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rcard .why { font-size: 12.5px; color: var(--muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
.rcard .known { font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.3em; }
.rcard .known b { color: var(--ink); font-weight: 550; }
.rcard .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.simrow { display: grid; grid-auto-flow: column; grid-auto-columns: 132px; gap: 14px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; }
.simrow .rcard .name { font-size: 14px; margin-top: 8px; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--active); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

/* artist page */
.hero { display: flex; gap: 22px; align-items: flex-end; margin-bottom: 8px; }
.hero .cover { width: 148px; flex: none; }
.hero .info { flex: 1; min-width: 0; }
.hero .stats { display: flex; gap: 18px; margin-top: 10px; flex-wrap: wrap; font-size: 14px; }
.hero .stats b { font-size: 18px; }
.hero .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin: 24px 0 16px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 9px 12px; cursor: pointer; color: var(--muted); font-weight: 600;
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .n { font-weight: 500; opacity: .7; margin-left: 3px; }
.tabs .sp { flex: 1; }
.tabs label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; padding: 0 4px; }

.albums { display: flex; flex-direction: column; gap: 2px; }
.album { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; padding: 10px; border-radius: 10px; }
.album:hover { background: var(--card); }
.album .cover { width: 56px; border-radius: 6px; box-shadow: none; }
.album .cover .ph { font-size: 16px; }
.album .t { font-weight: 650; }
.album .m { font-size: 13px; color: var(--muted); }
.album .d { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.album .right { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.album .acts { display: flex; gap: 4px; opacity: .0; transition: opacity .12s; }
.album:hover .acts, .album:focus-within .acts { opacity: 1; }
.album.dim { opacity: .55; }
.prog { height: 3px; background: var(--line); border-radius: 2px; margin-top: 6px; max-width: 360px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--active); transition: width .4s; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 650; padding: 3px 9px;
  border-radius: 99px; white-space: nowrap; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.pill.anim::before { animation: pulse 1.4s infinite; }
.s-have { --c: var(--have); } .s-downloading, .s-importing { --c: var(--active); } .s-searching { --c: var(--search); }
.s-queued { --c: var(--queued); } .s-not_found, .s-failed { --c: var(--bad); } .s-skipped { --c: var(--skip); }
.s-wanted, .s-missing, .s-upcoming { --c: var(--muted); }

/* queue + activity */
.list { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.row { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .cover { width: 44px; border-radius: 5px; box-shadow: none; }
.row .cover .ph { font-size: 14px; }
.row .t a { text-decoration: none; font-weight: 650; }
.row .t a:hover { text-decoration: underline; }
/* duplicates */
/* sign-in */
.auth-wrap { min-height: calc(100vh - 40px); display: grid; place-items: center; padding: 20px 0; }
.auth-card { width: min(400px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 28px 26px; box-shadow: var(--shadow); }
.auth-card .logo { font-size: 24px; margin-bottom: 18px; }
.auth-card .disc { width: 30px; height: 30px; }
.auth-card h1 { font-size: 22px; margin-bottom: 4px; }
.auth-card label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 6px; }
.auth-card input { width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); outline: none; font-size: 15px; }
.auth-card input:focus { border-color: var(--accent); }
.auth-card .btn { width: 100%; margin-top: 20px; padding: 10px; font-size: 15px; }
.auth-err { color: var(--bad); font-size: 13.5px; margin-top: 12px; min-height: 1em; }
/* user menu */
.umenu { position: relative; }
.ubtn { display: flex; align-items: center; gap: 8px; background: none; border: 1px solid transparent; border-radius: 99px; padding: 3px 10px 3px 3px; cursor: pointer; }
.ubtn:hover { background: var(--bg2); }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 12.5px;
  background: color-mix(in srgb, var(--accent) 22%, var(--card)); color: var(--accent); flex: none; }
.ubtn .un { font-size: 13.5px; font-weight: 600; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.udrop { position: absolute; right: 0; top: calc(100% + 6px); min-width: 230px; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow); padding: 8px; z-index: 30; }
.udrop .who { padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; font-size: 13px; color: var(--muted); }
.udrop .who b { display: block; color: var(--ink); font-size: 14.5px; }
.udrop button, .udrop a { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 8px;
  cursor: pointer; font-size: 14px; text-decoration: none; }
.udrop button:hover, .udrop a:hover { background: var(--bg2); }
.pwbox { display: grid; gap: 8px; padding: 6px 4px; }
.pwbox input { padding: 7px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); }
/* users + updates */
.utable { width: 100%; border-collapse: collapse; font-size: 14px; }
.utable th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 10px; font-weight: 700; }
.utable td { padding: 10px; border-top: 1px solid var(--line); vertical-align: middle; }
.utable select, .utable input[type=number] { padding: 5px 7px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); }
.utable input[type=number] { width: 72px; }
.utable .perm { display: flex; gap: 12px; flex-wrap: wrap; }
.utable .perm label { display: flex; gap: 5px; align-items: center; white-space: nowrap; }
.newuser { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
.newuser label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; }
.newuser label { min-width: 0; }
.newuser input, .newuser select { width: 100%; min-width: 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.notes h4 { margin: 10px 0 4px; font-size: 14.5px; } .notes h4:first-child { margin-top: 0; }
.notes ul { margin: 4px 0 8px; padding-left: 20px; } .notes p { margin: 4px 0 8px; }
.notes code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; background: var(--bg2); padding: 1px 5px; border-radius: 5px; }
.ver { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.notes { font-size: 13.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px; max-height: 320px; overflow: auto; margin-top: 10px; }
.code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; word-break: break-all; }
.overlay { position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px);
  display: grid; place-items: center; padding: 20px; }
.overlay .box { text-align: center; max-width: 460px; }
.spin { width: 42px; height: 42px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--accent); margin: 0 auto 18px;
  animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 720px) {
  .utable thead { display: none; }
  .utable tr { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
  .utable td { border: 0; padding: 2px 4px; }
  .ubtn .un { display: none; }
}
/* import + missing */
.prog.big { height: 6px; max-width: none; margin: 14px 0 6px; }
.prog.big i { background: var(--accent); }
.irow { display: grid; grid-template-columns: 26px 56px minmax(0, 1fr) minmax(0, 1.25fr); gap: 14px; align-items: center;
  padding: 12px 16px; border-top: 1px solid var(--line); }
.irow:first-child { border-top: 0; }
.irow.off { opacity: .55; }
.irow input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.irow .cover { width: 56px; border-radius: 8px; box-shadow: none; }
.irow .cover .ph { font-size: 16px; }
.irow .cover .src { font-size: 8px; letter-spacing: 0; padding-bottom: 2px; }
.irow .local .n { font-weight: 700; }
.irow .local .a, .irow .mb .d { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.irow .mb { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.irow .mb .top { display: flex; gap: 8px; align-items: center; min-width: 0; }
.irow .mb .arrow { color: var(--muted); }
.irow select { max-width: 100%; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); font-size: 13.5px; font-weight: 600; min-width: 0; }
.tag.warn { background: color-mix(in srgb, var(--active) 16%, transparent); color: var(--active); }
.tag.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.addbar { position: sticky; bottom: 12px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: flex-end;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; box-shadow: var(--shadow); margin-top: 16px; }
.addbar label { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.mgroup { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-top: 14px; overflow: hidden; }
.mgroup .hd { display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.mgroup .hd a { font-weight: 700; text-decoration: none; }
.mgroup .hd a:hover { text-decoration: underline; }
.mgroup .hd .sp { flex: 1; }
@media (max-width: 720px) {
  .irow { grid-template-columns: 26px 48px minmax(0, 1fr); }
  .irow .cover { width: 48px; }
  .irow .mb { grid-column: 2 / -1; }
  .addbar { justify-content: flex-start; }
}
.dsum { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line);

<main id="view"></main>
<div class="toast" id="toast"></div>

<script>

let me = null;

async function api(path, opts = {}) {
  const headers = { "X-Crate": "1" };

  const r = await fetch(path, { method: opts.method || "GET", headers, credentials: "same-origin",

}

  return art([a.image && { url: sized(a.image, size >= 500 ? 600 : 320), photo: true }, caa(a.cover_mbid, size)], a.name);
}
function ago(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 0) { const f = -s; return f < 3600 ? `in ${Math.round(f / 60)}m` : f < 86400 ? `in ${Math.round(f / 3600)}h` : `in ${Math.round(f / 86400)}d`; }
  if (s < 60) return "just now"; if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`; return `${Math.floor(s / 86400)}d ago`;

const today = new Date().toISOString().slice(0, 10);
const LABEL = { have: "In library", downloading: "Downloading", importing: "Importing", searching: "Searching",
  queued: "Source found", not_found: "Not found", failed: "Failed", skipped: "Skipped", wanted: "Wanted",
  missing: "Missing", upcoming: "Upcoming" };

/* ---------------- status / header ---------------- */
async function refreshStatus() {

  const c = $("#conn"), s = status.slskd || {};
  c.querySelector(".dot").className = "dot " + (s.ok ? "ok" : s.ok === false ? "bad" : "");

  if (status.worker_error && isAdmin()) out += `<div class="banner bad"><div style="flex:1"><b>Crate's background worker hit an error,</b> so searches and downloads may not be moving: <span class="mono">${esc(status.worker_error)}</span></div><a class="btn" href="#/activity">Activity</a></div>`;
  return out;
}

/* ---------------- artists list ---------------- */
let searchSeq = 0;
const ls = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
             set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let searchMode = ls.get("crate.searchMode", "artists"), addMonitor = ls.get("crate.addMonitor", "all");
let gridFilter = "", gridSort = ls.get("crate.sort", "name"), gridLimit = 200, gridKey = "";
const PAGE = 200;
const SORTS = [["name", "Name"], ["added", "Recently added"], ["missing", "Most missing"], ["active", "Downloading"], ["least", "Least complete"]];
const fold = t => (t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function sortArtists(list) {
  const pct = a => a.total ? a.have / a.total : 2;
  const by = { added: (a, b) => (b.added_at || "").localeCompare(a.added_at || ""),

}
async function viewArtists(first) {
  const [artists, requests] = await Promise.all([api("/api/artists"), api("/api/requests").catch(() => [])]);
  if (first) {

    view.innerHTML = `
      <div id="ban"></div>
      <div class="toolbar"><h1 class="grow">Your artists</h1>
        ${isAdmin() ? `<button class="btn ghost" id="rescan" title="Look for albums you already have on disk">Rescan library</button>
        <a class="btn" href="#/import" title="Find the artists already in your music folder and follow them">Import from library</a>` : ""}</div>
      <div class="addbox" ${can("artists") || can("downloads") ? "" : "hidden"}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

let reqKey = "";
function renderRequests(reqs) {
  const box = $("#reqs"); if (!box) return;
  const key = JSON.stringify(reqs);
  if (key === reqKey && box.innerHTML) return;
  reqKey = key;
  box.innerHTML = reqs.length ? `<h2>Requested albums <span class="chip">${reqs.length}</span></h2>

async function doSearch(term) {

  if (searchMode === "albums") return doAlbumSearch(term);

  if (seq !== searchSeq) return;

  res.innerHTML = items.map((a, i) => {
    const bits = [a.type, a.country, a.begin ? a.begin.slice(0, 4) + (a.end ? "–" + a.end.slice(0, 4) : "") : "", a.disambiguation, a.tags.join(", ")].filter(Boolean);

/* Fill in pictures + notable releases for search results, a few at a time. */
async function loadResultInfo(items, seq) {

    bindRecActions(box, () => { simCache.delete(id); renderSimilar(id); });

  if (first) {
    recKey = ""; recLimit = 60;
    view.innerHTML = `<div class="toolbar"><h1 class="grow">Discover</h1>
        <label class="sub" style="display:flex;gap:6px;align-items:center;font-size:13px" ${can("artists") ? "" : "hidden"}>When adding
          <select class="sel" id="dmon"><option value="all">All releases</option><option value="new">Only new releases</option></select></label></div>
      <div class="sub" id="dsub" style="margin:4px 0 18px"></div><div id="dban"></div><div id="dgrid"></div><div class="more" id="dmore"></div>`;
    const mon = $("#dmon"); mon.value = addMonitor;
    mon.onchange = () => { addMonitor = mon.value; ls.set("crate.addMonitor", addMonitor); };
  }
  const key = JSON.stringify([d, recLimit]);
  if (key === recKey) return;
  recKey = key;
  const p = d.progress || {};
  $("#dsub").textContent = `Artists similar to the ones you follow, from ListenBrainz${d.lastfm ? " and Last.fm" : ""}. The more of your artists an artist is similar to, the higher it ranks.`;
  let ban = "";
  if (!d.enabled) ban = `<div class="banner"><div style="flex:1"><b>Recommendations are turned off.</b>${isAdmin() ? " Turn them on in Settings." : ""}</div>${isAdmin() ? `<a class="btn" href="#/settings">Settings</a>` : ""}</div>`;
  else if (p.total && p.checked < p.total) ban = `<div class="banner"><span class="pulse"></span><div style="flex:1">Finding similar artists: checked <b>${p.checked}</b> of your <b>${p.total}</b> artists. More recommendations appear as it goes.</div></div>`;
  if (p.error && d.enabled) ban += `<div class="banner bad"><div style="flex:1"><b>Couldn't reach the recommendation service:</b> ${esc(p.error)}. Crate will try again.</div></div>`;
  $("#dban").innerHTML = ban;
  const g = $("#dgrid");
  if (!d.items.length) {
    g.className = "";
    g.innerHTML = d.enabled ? `<div class="blank"><div class="big">${p.total ? "No recommendations yet" : "Follow some artists first"}</div>${p.total ? "Similar artists show up here as Crate checks the artists you follow." : "Recommendations are based on the artists you follow."}</div>` : "";
    $("#dmore").innerHTML = "";
    return;
  }
  const shown = d.items.slice(0, recLimit);
  g.className = "grid";
  g.innerHTML = shown.map(r => recCard(r)).join("");
  bindRecActions(g, () => viewDiscover(false).catch(() => {}));
  const rest = d.items.length - shown.length;
  $("#dmore").innerHTML = rest > 0 ? `<button class="btn" id="dmorebtn">Show more <span class="sub">· ${rest} left</span></button>` : "";
  const mb = $("#dmorebtn"); if (mb) mb.onclick = () => { recLimit += 60; viewDiscover(false).catch(() => {}); };
  loadRecInfo(shown.map(r => r.mbid));
}

async function viewQueue(first) {
  const q = await api("/api/queue");
  if (unchanged(first, [q, status && status.slskd])) return;
  const row = a => `<div class="row">${cover(a.mbid, a.title, 250)}
    <div style="min-width:0"><div class="t"><a href="#/artist/${a.artist_id}">${esc(a.artist_name)}</a> — ${esc(a.title)} <span class="sub">${esc(a.year || "")}</span></div>
      <div class="d sub" style="font-size:13px">${esc(a.status_detail || (a.status === "wanted" ? "Waiting for a search slot" : ""))}${a.status === "not_found" && a.next_retry ? ` · next try ${ago(a.next_retry)}` : ""}</div>
      ${a.status === "downloading" ? `<div class="prog"><i style="width:${a.progress || 0}%"></i></div>` : ""}</div>
    <div class="right" style="display:flex;gap:8px;align-items:center"><div style="display:flex;gap:4px">${albumActions(a)}</div>${pill(a)}</div></div>`;
  const waiting = q.waiting.filter(a => effStatus(a) !== "upcoming");
  view.innerHTML = `${banner()}<div class="toolbar"><h1 class="grow">Queue</h1>
      ${isAdmin() ? `<button class="btn" data-clear-searches title="Remove finished searches from slskd's Searches page. Running searches are kept.">Clear slskd searches</button>` : ""}</div>
    <h2>In progress · ${q.active.length}</h2>

    <h2>Waiting · ${waiting.length}</h2>
    ${waiting.length ? `<div class="list">${waiting.map(row).join("")}</div>` : `<div class="list"><div class="empty">Nothing waiting.</div></div>`}`;
  bindAlbumActions();
  bindClearSearches();
}

/* ---------------- import from library ---------------- */
const importSel = new Map();   // result id -> {on, mbid}
let importTab = "new", importPoll = null, importInfo = new Map();
const CONF = {
  albums: r => `<span class="tag good" title="Your albums appear in this artist's releases on MusicBrainz">${r.match.overlap} album${r.match.overlap === 1 ? "" : "s"} match</span>`,
  name: () => `<span class="tag" title="The only MusicBrainz artist with this exact name">Name match</span>`,
  unsure: () => `<span class="tag warn" title="Several artists share this name, or the name only roughly matches. Check it's the right one.">Check this</span>`,
};
function importArt(r, alt) {
  const info = alt && importInfo.get(alt.mbid);
  const m = info ? info : r.match;
  if (!m) return art([], r.local_name);
  const srcs = [];
  if (m.image) srcs.push({ url: m.image, photo: true });
  (m.covers || []).forEach(c => srcs.push({ url: caa(c), label: "Album art" }));
  return art(srcs, (alt || r.match).name);
}
function altLabel(a) {
  return [a.name, a.disambiguation, a.country, a.begin && a.begin.slice(0, 4)].filter(Boolean).join(" · ");
}
const importOpts = { auto: false, onlyNew: false };
async function viewImport(first) {
  const d = await api("/api/import");
  clearTimeout(importPoll);
  const busy = d.state === "scanning" || d.state === "matching";
  if (busy || d.adding) importPoll = setTimeout(() => { if (location.hash === "#/import") viewImport(false); }, 1000);
  d.results.forEach(r => { if (!importSel.has(r.id)) importSel.set(r.id, { on: !!r.selected, mbid: r.match && r.match.mbid }); });
  if (unchanged(first, [d, importTab])) return;

  const groups = {
    new: d.results.filter(r => r.status === "matched"),
    none: d.results.filter(r => r.status === "none" || r.status === "error"),
    done: d.results.filter(r => r.status === "following" || r.status === "added"),
  };
  if (first && !groups[importTab].length) importTab = groups.new.length ? "new" : groups.none.length ? "none" : "new";
  const left = Math.max(0, d.total - d.matched);
  let body = "";
  if (d.state === "idle") {
    body = `<div class="blank"><div class="big">Follow the artists you already have</div>
      Crate looks through your music folder, works out which artists are in it, and matches each one on MusicBrainz.<br>
      You review the matches, then add them in one go. Albums you're missing are listed so you can choose what to download.<br><br>
      <button class="btn primary" id="iscan">Scan music folder</button></div>`;
  } else if (d.state === "error") {
    body = `<div class="banner bad">${esc(d.error)}</div>`;
  } else {
    if (busy) {
      const pct = d.total ? Math.round(d.matched * 100 / d.total) : 0;
      body += `<div class="list" style="padding:14px 16px">
        <div style="display:flex;gap:10px;align-items:center"><span class="pulse"></span><b>${d.state === "scanning" ? `Scanning folders… ${d.folders}` : `Matching artists on MusicBrainz… ${d.matched} of ${d.total}`}</b></div>
        <div class="prog big"><i style="width:${pct}%"></i></div>
        <div class="sub" style="font-size:13px">${d.state === "matching" && left > 5 ? `About ${Math.max(1, Math.round(left * 2.3 / 60))} min left. MusicBrainz allows about one request per second. ` : ""}You can review the matches below while it works.</div></div>`;
    }
    if (d.adding) body += `<div class="banner"><span class="pulse"></span><div style="flex:1">Fetching discographies for the artists you added…</div><a class="btn" href="#/missing">Missing albums</a></div>`;
    const tabs = [["new", "To add", groups.new.length], ["none", "No match", groups.none.length], ["done", "Following", groups.done.length]];
    body += `<div class="tabs">${tabs.map(([k, l, n]) => `<button data-itab="${k}" class="${k === importTab ? "on" : ""}">${l}<span class="n">${n}</span></button>`).join("")}
      <span class="sp"></span>${importTab === "new" && groups.new.length ? `<label><a href="#" id="iall">Select all</a> · <a href="#" id="inone">None</a></label>` : ""}</div>`;
    const list = groups[importTab];
    body += list.length ? `<div class="list">${list.map(importRow).join("")}</div>`
      : `<div class="list"><div class="empty">${importTab === "new" ? (busy ? "Matches will appear here…" : "Nothing new to add.") : importTab === "none" ? "Every artist was matched." : "None yet."}</div></div>`;
    if (importTab === "new" && groups.new.length) {
      body += `<div class="addbar"><span class="sub" id="icount" style="margin-right:auto"></span>
        <label title="Off: albums you don't have are listed under Missing albums for you to pick. On: Crate starts downloading them right away."><input type="checkbox" id="iauto" ${importOpts.auto ? "checked" : ""}> Download missing albums automatically</label>
        <label title="Older albums you're missing are skipped (you can still download them by hand); only releases from now on are fetched."><input type="checkbox" id="inew" ${importOpts.onlyNew ? "checked" : ""}> Only new releases</label>
        <button class="btn primary" id="iadd">Add artists</button></div>`;
    }
  }
  view.innerHTML = `<div class="toolbar"><h1 class="grow">Import from library</h1>
      ${d.state !== "idle" ? `<button class="btn" id="iscan" ${busy ? "disabled" : ""}>${busy ? "Scanning…" : "Scan again"}</button>` : ""}</div>
    <div class="sub" style="margin-top:4px">${d.state === "done" ? `${d.total} artist${d.total === 1 ? "" : "s"} found in ${d.folders} album folders · scanned ${ago(d.finished_at)}` : "Finds the artists in your music library folder and matches them on MusicBrainz."}</div>
    ${body}`;

  const sc = $("#iscan"); if (sc) sc.onclick = async () => { await api("/api/import/scan", { method: "POST" }); viewImport(true); };
  view.querySelectorAll("[data-itab]").forEach(b => b.onclick = () => { importTab = b.dataset.itab; viewImport(true); });
  const setAll = on => { groups.new.forEach(r => { importSel.get(r.id).on = on; }); viewImport(true); };
  const ia = $("#iall"); if (ia) ia.onclick = e => { e.preventDefault(); setAll(true); };
  const inn = $("#inone"); if (inn) inn.onclick = e => { e.preventDefault(); setAll(false); };
  view.querySelectorAll("[data-ichk]").forEach(c => c.onchange = () => {
    importSel.get(c.dataset.ichk).on = c.checked; c.closest(".irow").classList.toggle("off", !c.checked); importCount(groups.new);
  });
  view.querySelectorAll("[data-ialt]").forEach(sel => sel.onchange = async () => {
    const r = d.results.find(x => x.id === sel.dataset.ialt), st = importSel.get(r.id);
    st.mbid = sel.value; st.on = true;
    const row = sel.closest(".irow"); row.classList.remove("off"); row.querySelector("[data-ichk]").checked = true;
    const alt = r.alternatives.find(a => a.mbid === sel.value);
    const tagBox = row.querySelector(".conf"); if (tagBox) tagBox.innerHTML = `<span class="tag">Your choice</span>`;
    importCount(groups.new);
    if (!importInfo.has(alt.mbid) && alt.mbid !== r.match.mbid) {
      try { importInfo.set(alt.mbid, await api(`/api/mb/artists/${encodeURIComponent(alt.mbid)}/info`)); } catch {}
    }
    row.querySelector(".ia").innerHTML = importArt(r, alt.mbid === r.match.mbid ? null : alt);
    const info = importInfo.get(alt.mbid) || (alt.mbid === r.match.mbid ? r.match : null);
    row.querySelector(".mb .d").textContent = info && info.albums && info.albums.length ? "Releases: " + info.albums.map(x => x.title).join(", ") : "";
  });
  const add = $("#iadd");
  if ($("#iauto")) $("#iauto").onchange = e => { importOpts.auto = e.target.checked; };
  if ($("#inew")) $("#inew").onchange = e => { importOpts.onlyNew = e.target.checked; };
  if (add) {
    importCount(groups.new);
    add.onclick = async () => {
      const items = groups.new.filter(r => importSel.get(r.id).on).map(r => ({ id: r.id, mbid: importSel.get(r.id).mbid }));
      if (!items.length) return toast("Tick the artists you want to add");
      add.disabled = true;
      try {
        const auto = $("#iauto").checked, onlyNew = $("#inew").checked;
        const res = await api("/api/import/add", { method: "POST", body: { items, auto_download: auto, only_new: onlyNew } });
        toast(`Added ${res.result.added} artist${res.result.added === 1 ? "" : "s"}. ${onlyNew ? "Only new releases will be fetched." : auto ? "Missing albums will start downloading." : "Fetching discographies; then pick what to download."}`);
        importTab = "done"; viewImport(true);
      } catch (e) { toast(e.message); add.disabled = false; }
    };
  }
}
function importCount(list) {
  const n = list.filter(r => importSel.get(r.id).on).length;
  const c = $("#icount"); if (c) c.textContent = `${n} of ${list.length} selected`;
  const b = $("#iadd"); if (b) { b.textContent = n ? `Add ${n} artist${n === 1 ? "" : "s"}` : "Add artists"; b.disabled = !n; }
}
function importRow(r) {
  const st = importSel.get(r.id) || {};
  const local = `<div class="local" style="min-width:0"><div class="n">${esc(r.local_name)}</div>
    <div class="a" title="${esc(r.local_albums.join(", "))}">${r.album_count} album${r.album_count === 1 ? "" : "s"} · ${esc(r.local_albums.slice(0, 3).join(", "))}</div></div>`;
  if (r.status === "following" || r.status === "added") {
    return `<div class="irow"><span></span><span class="ia">${importArt(r)}</span>${local}
      <div class="mb"><div class="top">${r.status === "added" ? `<span class="tag good">Added</span>` : `<span class="tag">Following</span>`}
        <a href="#/artist/${r.artist_id}" class="btn sm ghost">Open artist</a></div></div></div>`;
  }
  if (r.status !== "matched") {
    return `<div class="irow off"><span></span><span class="ia">${importArt(r)}</span>${local}
      <div class="mb"><div class="top"><span class="tag bad">${r.status === "error" ? "Lookup failed" : "No match on MusicBrainz"}</span></div>
      <div class="d">${r.status === "error" ? esc(r.error) : "Rename the folder to the artist's name, or add them from the Artists page search."}</div></div></div>`;
  }
  const alts = r.alternatives;
  const chosen = alts.find(a => a.mbid === st.mbid) || r.match;
  const info = chosen.mbid === r.match.mbid ? r.match : importInfo.get(chosen.mbid);
  const releases = info && info.albums && info.albums.length ? "Releases: " + info.albums.map(x => x.title).join(", ") : "";
  return `<div class="irow ${st.on ? "" : "off"}"><input type="checkbox" data-ichk="${r.id}" ${st.on ? "checked" : ""} aria-label="Add ${esc(r.local_name)}">
    <span class="ia">${importArt(r, chosen.mbid === r.match.mbid ? null : chosen)}</span>${local}
    <div class="mb"><div class="top"><span class="arrow">→</span>
      ${alts.length > 1 ? `<select data-ialt="${r.id}" aria-label="MusicBrainz artist">${alts.map(a => `<option value="${esc(a.mbid)}" ${a.mbid === chosen.mbid ? "selected" : ""}>${esc(altLabel(a))}</option>`).join("")}</select>`
        : `<b style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(altLabel(chosen))}</b>`}
      <span class="conf">${chosen.mbid === r.match.mbid ? CONF[r.confidence](r) : `<span class="tag">Your choice</span>`}</span></div>
      <div class="d" title="${esc(releases)}">${esc(releases)}</div></div></div>`;
}

/* ---------------- duplicates ---------------- */
function fmtBytes(n) {
  if (!n) return "0 MB";
  if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 0 : 1) + " GB";
  if (n >= 1e6) return Math.round(n / 1e6) + " MB";
  return Math.max(1, Math.round(n / 1e3)) + " KB";
}
function fmtBadge(ext, fm) {
  const label = ext.toUpperCase() + (fm && fm.bitrate ? " " + fm.bitrate : "");
  return `<span class="fmt ${fm && fm.lossless ? "lossless" : "lossy"}">${esc(label)}</span>`;
}
function confirmClick(b, fn, need = true) {
  if (need && b.dataset.confirm !== "1") {
    b.dataset.confirm = "1"; b.dataset.label = b.textContent; b.textContent = "Click again to confirm";
    setTimeout(() => { if (b.dataset.confirm === "1") { b.dataset.confirm = ""; b.textContent = b.dataset.label; } }, 3000);
    return;
  }
  b.dataset.confirm = ""; fn();
}
let dupePoll = null, dupeTab = null;
const FMT_ORDER = ["flac", "alac", "ape", "wv", "wav", "aiff", "mp3", "m4a", "aac", "ogg", "opus", "wma"];
const sortFmts = list => [...list].sort((a, b) => (FMT_ORDER.indexOf(a) + 100) % 100 - (FMT_ORDER.indexOf(b) + 100) % 100 || a.localeCompare(b));
const mmss = sec => sec ? `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}` : "";
async function viewDupes(first) {
  const d = await api("/api/dupes");
  clearTimeout(dupePoll);
  if (d.state === "scanning") dupePoll = setTimeout(() => { if (location.hash === "#/duplicates") viewDupes(false); }, 800);
  const songs = d.song_groups || [];
  if (!dupeTab || (first && d.state === "done" && !(dupeTab === "albums" ? d.groups.length : songs.length)))
    dupeTab = d.groups.length || !songs.length ? "albums" : "songs";
  if (unchanged(first, [d, dupeTab])) return;
  const del = d.action === "delete";
  const scanBtn = `<button class="btn ${d.scanned_at ? "" : "primary"}" id="dscan" ${d.state === "scanning" ? "disabled" : ""}>${d.state === "scanning" ? "Scanning…" : d.scanned_at ? "Scan again" : "Scan library"}</button>`;
  const trashNote = `<div class="dnote">${del ? "<b>Removed files are deleted permanently.</b> You can switch to a trash folder in Settings." :
        `Removed files go to <span class="mono">${esc(d.trash.path)}</span> so you can restore them.`}
        ${d.trash.size ? ` Trash holds ${fmtBytes(d.trash.size)}. <button class="btn sm ghost danger" id="dempty">Empty trash</button>` : ""}</div>`;
  let body = "";
  if (d.state === "scanning") {
    body = `<div class="blank"><div class="big" style="display:flex;gap:10px;align-items:center;justify-content:center"><span class="pulse"></span>Scanning your library…</div>${d.folders_scanned} album folders${d.files_scanned ? ` · ${d.files_scanned} songs` : ""} checked so far</div>`;
  } else if (d.state === "error") {
    body = `<div class="banner bad">${esc(d.error)}</div>`;
  } else if (!d.scanned_at) {
    body = `<div class="blank"><div class="big">Find music you have more than once</div>
      Crate looks through your music library for <b>albums</b> in two or more folders or saved as both FLAC and MP3,
      and for <b>songs</b> you have several copies of, like <span class="mono">Song.mp3</span> and <span class="mono">Song (1).mp3</span>, or the same track on an album and as a single.<br>Nothing is removed until you choose.</div>`;
  } else if (!d.groups.length && !songs.length) {
    body = `<div class="blank"><div class="big">No duplicates</div>${d.folders_scanned} album folders and ${d.files_scanned} songs checked ${ago(d.scanned_at)}.</div>${d.trash.size ? trashNote : ""}`;
  } else {
    body = `<div class="tabs">
        <button data-dtab="albums" class="${dupeTab === "albums" ? "on" : ""}">Albums<span class="n">${d.groups.length}</span></button>
        <button data-dtab="songs" class="${dupeTab === "songs" ? "on" : ""}">Songs<span class="n">${songs.length}</span></button></div>`;
    if (dupeTab === "albums") {
      if (!d.groups.length) body += `<div class="list"><div class="empty">No duplicate albums.</div></div>${trashNote}`;
      else {
        const fmts = new Set();
        d.groups.forEach(g => g.copies.forEach(c => { if (g.type === "copies") fmts.add(c.main); else c.mixed_formats.forEach(f => fmts.add(f)); }));
        body += `<div class="dsum">
            <div><div class="big">${d.groups.length} duplicate album${d.groups.length === 1 ? "" : "s"}</div>
              <div class="sub" style="font-size:13px">Removing the extra copies frees about ${fmtBytes(d.savings)}</div></div>
            <div class="bulk">
              ${sortFmts(fmts).map(f => `<button class="btn" data-bulk="keep_format" data-fmt="${esc(f)}" title="Everywhere there's a ${esc(f.toUpperCase())} copy, keep the best one and remove the others. Albums without a ${esc(f.toUpperCase())} copy are left alone.">Keep ${esc(f.toUpperCase())} everywhere</button>`).join("")}
              <button class="btn primary" data-bulk="suggested" title="Keep the suggested copy of every album (highlighted in green).">Apply all suggestions</button>
            </div></div>${trashNote}${d.groups.map(dupeGroup).join("")}`;
      }
    } else {
      if (!songs.length) body += `<div class="list"><div class="empty">No duplicate songs.</div></div>${trashNote}`;
      else {
        const fmts = new Set(); songs.forEach(g => g.songs.forEach(x => fmts.add(x.ext)));
        const copies = songs.reduce((n, g) => n + g.songs.length - 1, 0);
        body += `<div class="dsum">
            <div><div class="big">${songs.length} duplicate song${songs.length === 1 ? "" : "s"}</div>
              <div class="sub" style="font-size:13px">${copies} extra cop${copies === 1 ? "y" : "ies"} · removing them frees about ${fmtBytes(d.song_savings)}</div></div>
            <div class="bulk">
              ${fmts.size > 1 ? sortFmts(fmts).map(f => `<button class="btn" data-sbulk="songs_keep_format" data-fmt="${esc(f)}" title="For every song that has a ${esc(f.toUpperCase())} copy, keep the best one and remove the rest. Songs without a ${esc(f.toUpperCase())} copy are left alone.">Keep ${esc(f.toUpperCase())} everywhere</button>`).join("") : ""}
              <button class="btn primary" data-sbulk="songs_suggested" title="Keep the suggested copy of every song (highlighted in green) and remove all the other copies.">Remove all duplicates</button>
            </div></div>${trashNote}
          <div class="dnote">Songs match by artist and title. Live, remix and other differently-titled versions are kept apart, and so are versions with very different lengths when tags are available. Remastered copies count as the same song. Songs from duplicate albums are on the Albums tab.</div>
          ${songs.map(songGroup).join("")}`;
      }
    }
  }
  view.innerHTML = `<div class="toolbar"><h1 class="grow">Duplicates</h1>${scanBtn}</div>
    <div class="sub" style="margin-top:4px">${d.scanned_at && d.state !== "scanning" ? `Last scan ${ago(d.scanned_at)} · ${d.folders_scanned} album folders · ${d.files_scanned} songs` : "Scans the music library folder set in Settings."}</div>
    ${body}`;

  $("#dscan").onclick = async () => { await api("/api/dupes/scan", { method: "POST" }); viewDupes(true); };
  view.querySelectorAll("[data-dtab]").forEach(b => b.onclick = () => { dupeTab = b.dataset.dtab; viewDupes(true); });
  const empty = $("#dempty");
  if (empty) empty.onclick = () => confirmClick(empty, async () => {
    const r = await api("/api/dupes/trash/empty", { method: "POST" }); toast(`Emptied trash · freed ${fmtBytes(r.emptied.size)}`); viewDupes(true);
  });
  const run = async (b, payload, done) => {
    b.disabled = true;
    try {
      const r = await api("/api/dupes/resolve", { method: "POST", body: payload });
      const x = r.result;
      toast(done(x) + ` · ${fmtBytes(x.bytes)} ${del ? "deleted" : "moved to trash"}${x.skipped ? ` · ${x.skipped} left alone` : ""}`);
      viewDupes(true);
    } catch (e) { toast(e.message); b.disabled = false; }
  };
  view.querySelectorAll("[data-keep]").forEach(b => b.onclick = () => confirmClick(b, () =>
    run(b, { group: b.dataset.group, keep: b.dataset.keep }, () => "Kept one copy"), del));
  view.querySelectorAll("[data-rmfmt]").forEach(b => b.onclick = () => confirmClick(b, () =>
    run(b, { group: b.dataset.group, remove_format: b.dataset.rmfmt }, () => `Removed ${b.dataset.rmfmt.toUpperCase()} files`), del));
  view.querySelectorAll("[data-bulk]").forEach(b => b.onclick = () => confirmClick(b, () =>
    run(b, { all: b.dataset.bulk, format: b.dataset.fmt }, x => `Cleaned up ${x.groups} album${x.groups === 1 ? "" : "s"}`)));
  view.querySelectorAll("[data-skeep]").forEach(b => b.onclick = () => confirmClick(b, () =>
    run(b, { song_group: b.dataset.group, keep: b.dataset.skeep }, x => `Kept one copy, removed ${x.files}`), del));
  view.querySelectorAll("[data-srm]").forEach(b => b.onclick = () => confirmClick(b, () =>
    run(b, { song_group: b.dataset.group, remove: b.dataset.srm }, () => "Removed 1 copy"), del));
  view.querySelectorAll("[data-sbulk]").forEach(b => b.onclick = () => confirmClick(b, () =>
    run(b, { all: b.dataset.sbulk, format: b.dataset.fmt }, x => `Removed ${x.files} duplicate song file${x.files === 1 ? "" : "s"}`)));
}
function songGroup(g) {
  return `<div class="dgroup"><div class="hd"><span class="t">${esc(g.artist)} — ${esc(g.title)}</span>
      <span class="k">${g.songs.length} copies</span>${g.savings ? `<span class="save">frees ${fmtBytes(g.savings)}</span>` : ""}</div>
    ${g.songs.map(x => {
      const sugg = x.id === g.suggest_keep;
      const where = x.unit_tracks > 1 ? `on ${esc(x.album || x.unit_rel)} (${x.unit_tracks} tracks)` : `in ${esc(x.unit_rel)}`;
      const bits = [mmss(x.duration), fmtBytes(x.size)].filter(Boolean).join(" · ");
      return `<div class="dcopy ${sugg ? "sugg" : ""}">${fmtBadge(x.ext, x)}
        <div class="info"><span>${bits} · ${where}</span>
          <span class="tags">${sugg ? `<span class="tag good">Suggested keep</span>` : ""}${x.copy_marked ? `<span class="tag warn">Copy</span>` : ""}</span>
          <span class="mono" title="${esc(x.rel)}">${esc(x.rel)}</span></div>
        <div style="display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap">
          <button class="btn sm ghost danger" data-group="${g.id}" data-srm="${x.id}">Remove</button>
          <button class="btn sm ${sugg ? "primary" : ""}" data-group="${g.id}" data-skeep="${x.id}">Keep only this</button></div></div>`;
    }).join("")}</div>`;
}
function dupeGroup(g) {
  const head = `<div class="hd"><span class="t">${esc(g.artist)} — ${esc(g.album)}</span>
    <span class="k">${g.type === "copies" ? `${g.copies.length} folders` : `${g.copies[0].mixed_formats.map(f => f.toUpperCase()).join(" + ")} in one folder`}</span>
    ${g.savings ? `<span class="save">frees ${fmtBytes(g.savings)}</span>` : ""}</div>`;
  if (g.type === "copies") {
    return `<div class="dgroup">${head}${g.copies.map(c => {
      const sugg = c.id === g.suggest_keep;
      const fm = c.formats[c.main];
      const others = Object.keys(c.formats).filter(e => e !== c.main);
      return `<div class="dcopy ${sugg ? "sugg" : ""}">${fmtBadge(c.main, fm)}
        <div class="info"><span>${c.tracks} track${c.tracks === 1 ? "" : "s"}${c.discs > 1 ? ` · ${c.discs} discs` : ""} · ${fmtBytes(c.size)}${others.length ? ` · also ${others.map(e => c.formats[e].count + " " + e.toUpperCase()).join(", ")}` : ""}</span>
          <span class="tags">${sugg ? `<span class="tag good">Suggested</span>` : ""}${c.crate_album ? `<span class="tag">Downloaded by Crate</span>` : ""}</span>
          <span class="mono" title="${esc(c.rel)}">${esc(c.rel)}</span></div>
        <button class="btn sm ${sugg ? "primary" : ""}" data-group="${g.id}" data-keep="${c.id}">Keep this, remove ${g.copies.length > 2 ? "others" : "other"}</button></div>`;
    }).join("")}</div>`;
  }
  const c = g.copies[0];
  return `<div class="dgroup">${head}${c.mixed_formats.map(e => {
    const fm = c.formats[e], sugg = (g.suggest_remove_formats || []).includes(e);
    return `<div class="dcopy ${e === g.suggest_keep_format ? "sugg" : ""}">${fmtBadge(e, fm)}
      <div class="info"><span>${fm.count} track${fm.count === 1 ? "" : "s"} · ${fmtBytes(fm.size)}</span>
        <span class="tags">${e === g.suggest_keep_format ? `<span class="tag good">Suggested keep</span>` : ""}</span>
        <span class="mono" title="${esc(c.rel)}">${esc(c.rel)}</span></div>
      <button class="btn sm ${sugg ? "primary" : ""}" data-group="${g.id}" data-rmfmt="${esc(e)}">Remove ${esc(e.toUpperCase())} files</button></div>`;
  }).join("")}</div>`;
}

        <option value="user" ${!admin ? "selected" : ""}>User</option><option value="admin" ${admin ? "selected" : ""}>Admin</option></select></td>

        `<label title="Allowed to ${esc(l)}"><input type="checkbox" data-perm="${k}" ${u.perms[k] ? "checked" : ""}> ${esc(l[0].toUpperCase() + l.slice(1))}</label>`).join("")}</div>`}</td>

    <div class="form" style="max-width:none">

        <form class="newuser" id="nuf" autocomplete="off">
          <label>Username<input name="username" required minlength="2" autocomplete="off"></label>
          <label>Password<input name="password" type="password" required minlength="6" autocomplete="new-password"></label>
          <label>Role<select name="role"><option value="user">User</option><option value="admin">Admin</option></select></label>
          <label title="Albums per day; 0 = no limit">Daily album limit<input name="daily_limit" type="number" min="0" value="10"></label>
          <button class="btn primary" type="submit">Add user</button>
        </form>
        <div class="checks" id="nup" style="margin-top:10px">${Object.entries(perms).map(([k, l]) => `<label><input type="checkbox" data-nperm="${k}" checked> Can ${esc(l)}</label>`).join("")}</div>
      </div>
      <div class="fs" style="padding:8px 10px"><table class="utable"><thead><tr><th>User</th><th>Role</th><th>Can</th><th>Daily limit</th><th></th></tr></thead>
        <tbody>${d.users.map(row).join("")}</tbody></table></div>
      <p class="sub" style="font-size:13px">Locked out? On the server run <span class="mono">docker exec -it crate python -m crate reset-password USERNAME</span>.</p>
    </div>`;
  bindSettingsTabs();
  $("#nuf").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target), body = Object.fromEntries(f.entries());
    body.daily_limit = +body.daily_limit; body.perms = {};
    view.querySelectorAll("[data-nperm]").forEach(c => body.perms[c.dataset.nperm] = c.checked);
    try { const u = await api("/api/users", { method: "POST", body }); toast(`Added ${u.username}`); viewUsers(); } catch (x) { toast(x.message); }
  };
  const patch = async (uid, body, okMsg) => {
    try { await api(`/api/users/${uid}`, { method: "PATCH", body }); toast(okMsg || "Saved"); }
    catch (x) { toast(x.message); }
    viewUsers();
  };
  view.querySelectorAll("tr[data-uid]").forEach(tr => {
    const uid = +tr.dataset.uid;

    const lim = tr.querySelector('[data-f="daily_limit"]'); if (lim) lim.onchange = () => patch(uid, { daily_limit: +lim.value }, "Daily limit saved");
    tr.querySelectorAll("[data-perm]").forEach(c => c.onchange = () => patch(uid, { perms: { [c.dataset.perm]: c.checked } }, "Permissions saved"));
    tr.querySelector("[data-reset]").onclick = e => {
      const td = e.target.closest("td");
      td.innerHTML = `<form style="display:flex;gap:6px;justify-content:flex-end"><input type="password" placeholder="New password" minlength="6" required style="padding:5px 8px;border-radius:7px;border:1px solid var(--line);background:var(--bg);width:150px"><button class="btn sm primary">Set</button></form>`;
      const form = td.querySelector("form"); form.querySelector("input").focus();

    };
    const del = tr.querySelector("[data-del]");
    if (del) del.onclick = () => confirmClick(del, async () => {
      try { await api(`/api/users/${uid}`, { method: "DELETE" }); toast("User removed"); } catch (x) { toast(x.message); }
      viewUsers();
    });
  });
}

/* ---------------- settings: updates ---------------- */
async function viewUpdates(fresh) {
  view.innerHTML = `<h1>Settings</h1>${settingsTabs()}<div class="blank"><span class="pulse"></span> Checking for updates…</div>`;
  bindSettingsTabs();
  let st;
  try { st = await api("/api/update" + (fresh ? "?fresh=1" : "")); } catch (x) { view.querySelector(".blank").textContent = x.message; return; }
  const L = st.latest, lr = st.last_result;
  const state = !st.enabled ? `<span class="pill s-skipped">Checks off</span>` : !L ? `<span class="pill s-failed">Couldn't check</span>`
    : st.update_available ? `<span class="pill s-downloading">Update available</span>` : `<span class="pill s-have">Up to date</span>`;
  const manual = st.docker ? "docker compose pull\ndocker compose up -d" : "git pull\n# then restart Crate";
  view.innerHTML = `<h1>Settings</h1>${settingsTabs()}<div class="form">
    <div class="fs">
      <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end">
        <div><div class="sub" style="font-size:13px">Installed</div><div class="ver">${esc(st.current_version)}</div></div>
        ${L ? `<div><div class="sub" style="font-size:13px">Latest release</div><div class="ver">${esc(L.version)}</div></div>` : ""}
        <div style="margin-left:auto;display:flex;gap:8px;align-items:center">${state}<button class="btn" id="ucheck">Check now</button></div>
      </div>
      ${st.message ? `<p class="sub" style="margin:12px 0 0">${esc(st.message)}</p>` : ""}
      ${st.applying ? `<div class="banner" style="margin:14px 0 0"><span class="pulse"></span><div>Updating to ${esc(st.applying.to)}…</div></div>` : ""}
      ${L ? `<div style="margin-top:16px"><b>${esc(L.name)}</b> <span class="sub">${L.published_at ? "· released " + ago(L.published_at) : ""} · <a href="${esc(L.url)}" target="_blank" rel="noopener">view on GitHub ↗</a></span>
        ${L.notes ? `<div class="notes">${mdLite(L.notes)}</div>` : ""}</div>` : ""}
      ${st.update_available ? (st.can_auto_update
        ? `<div style="margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="uapply">Update to ${esc(L.version)}</button>
            <span class="sub" style="font-size:13px">Crate backs up its database, downloads the new version and restarts. If the new version doesn't start properly, it switches back automatically.</span></div>`
        : `<div class="banner" style="margin:16px 0 0;display:block"><b>Crate can't update itself here.</b> ${esc(st.reason)}<div class="code" style="margin-top:8px">${esc(manual)}</div></div>`) : ""}
    </div>
    ${lr ? `<div class="fs"><h3>Last update</h3><p style="margin:0">${esc(lr.from)} → ${esc(lr.to)} · ${lr.ok ? `<span class="ok">installed</span>` : lr.rolled_back ? `<span class="bad">rolled back</span>, the previous version kept running` : `<span class="bad">failed</span>`} ${lr.at ? "· " + ago(new Date(lr.at * 1000).toISOString()) : ""}</p>
      ${!lr.ok ? `<p class="sub" style="margin:8px 0 0">${esc(lr.reason || "")}</p>${lr.recovery ? `<div class="code" style="margin-top:8px">${esc(lr.recovery)}</div>` : ""}` : ""}
      ${lr.log && lr.log.length ? `<details style="margin-top:8px"><summary class="sub" style="cursor:pointer">Details</summary><div class="code" style="margin-top:6px">${esc(lr.log.join("\n"))}</div></details>` : ""}</div>` : ""}
    <div class="fs"><h3>Update settings</h3>
      <div class="field"><label for="uen">Check for updates</label><div class="checks"><label><input type="checkbox" id="uen" ${st.enabled ? "checked" : ""}> Check GitHub for new releases every 6 hours and tell admins</label></div></div>
      <div class="field"><label for="urepo">Release source</label><input id="urepo" type="text" value="${esc(st.repo)}" ${st.repo_locked ? "disabled" : ""} placeholder="owner/repository">
        <div class="hint">${st.repo_locked ? "Set by the Docker image." : "GitHub repository whose releases Crate follows."}</div></div>
      <div class="field"><span></span><div class="sub" style="font-size:13px">Running ${st.docker ? `in Docker${st.container ? ` as <span class="mono">${esc(st.container)}</span>` : ""}` : "directly with Python"}.
        ${st.docker && !st.can_auto_update && !st.update_available ? esc(st.reason) : ""}</div></div>
    </div></div>`;
  bindSettingsTabs();
  $("#ucheck").onclick = () => viewUpdates(true);
  $("#uen").onchange = async e => { await api("/api/update/config", { method: "POST", body: { enabled: e.target.checked } }); viewUpdates(); };
  const repo = $("#urepo"); if (!st.repo_locked) repo.onchange = async () => { try { await api("/api/update/config", { method: "POST", body: { repo: repo.value } }); viewUpdates(true); } catch (x) { toast(x.message); } };
  const ap = $("#uapply");
  if (ap) ap.onclick = () => confirmClick(ap, async () => {
    ap.disabled = true; ap.textContent = "Downloading the new version…";
    try { const r = await api("/api/update/apply", { method: "POST" }); waitForUpdate(r.target_version); }
    catch (x) { toast(x.message); ap.disabled = false; ap.textContent = `Update to ${L.version}`; }
  });
}
/* Release notes: a small, safe Markdown subset (everything is escaped first). */
function mdLite(src) {
  const inline = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let html = "", list = false, code = false;
  for (const raw of String(src).replace(/\r/g, "").split("\n")) {
    const line = raw.trimEnd();
    if (line.startsWith("```")) { code = !code; html += code ? '<div class="code">' : "</div>"; continue; }
    if (code) { html += esc(line) + "\n"; continue; }
    const li = line.match(/^\s*[-*]\s+(.*)/);
    if (li) { if (!list) { html += "<ul>"; list = true; } html += `<li>${inline(li[1])}</li>`; continue; }
    if (list) { html += "</ul>"; list = false; }
    const h = line.match(/^#{1,6}\s+(.*)/);
    if (h) html += `<h4>${inline(h[1])}</h4>`;
    else if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  return html + (list ? "</ul>" : "") + (code ? "</div>" : "");
}
function waitForUpdate(target) {
  clearInterval(timer); clearInterval(statusTimer);
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `<div class="box"><div class="spin"></div><h1 style="font-size:22px">Updating Crate to ${esc(target)}</h1>
    <p class="sub" id="ovmsg">Crate is restarting with the new version. This page reloads by itself when it's back, usually within a minute.</p></div>`;
  document.body.appendChild(ov);
  const startAt = Date.now();
  const tick = async () => {
    try {
      const v = await (await fetch("/api/version", { cache: "no-store" })).json();
      if (v.version === target) { $("#ovmsg").textContent = "Done! Reloading…"; setTimeout(() => location.reload(), 800); return; }
    } catch {}
    if (Date.now() - startAt > 6 * 60 * 1000) {
      $(".box", ov).innerHTML = `<h1 style="font-size:22px">The update didn't finish</h1><p class="sub">Crate is still on the previous version; it probably switched back because the new one didn't start properly. Settings → Updates shows what happened.</p><button class="btn primary" onclick="location.href='#/settings/updates';location.reload()">Open Settings → Updates</button>`;
      return;
    }
    setTimeout(tick, 3000);
  };
  setTimeout(tick, 4000);
}

/* ---------------- router ---------------- */
async function render(first = false) {
  const h = location.hash.replace(/^#/, "") || "/";
  const [, v, id] = h.match(/^\/(\w*)\/?([\w-]+)?/) || [];
  if (v === "duplicates" && !isAdmin()) { view.innerHTML = `<div class="blank"><div class="big">Admins only</div></div>`; return; }
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on",
    a.dataset.v === (["artist", "import", "missing", ""].includes(v || "") ? "artists" : v)));
  try {
    if (v === "artist" && id) await viewArtist(id, first);
    else if (v === "queue") await viewQueue(first);
    else if (v === "activity") await viewActivity(first);
    else if (v === "duplicates") await viewDupes(first);
    else if (v === "import") await viewImport(first);
    else if (v === "missing") await viewMissing(first);
    else if (v === "discover") await viewDiscover(first);
    else if (v === "settings") { if (first) await viewSettings(id || "general"); }
    else await viewArtists(first);
  } catch (e) { view.innerHTML = `<div class="blank"><div class="big">Something went wrong</div>${esc(e.message)}</div>`; }
}
function go() {
  clearInterval(timer);
  window.scrollTo(0, 0);
  render(true);
  const v = (location.hash.match(/^#\/(\w*)/) || [])[1] || "";
  if (v !== "settings") timer = setInterval(() => {
    if (document.hidden || document.querySelector('[data-confirm="1"]')) return;
    const active = document.activeElement;
    if (active && active.id === "q") { if (v === "" ) viewArtists(false).catch(() => {}); return; }
    render(false);
  }, v === "activity" ? 5000 : 3000);
}
/* ---------------- sign-in ---------------- */
let statusTimer = null, started = false;
function signedOut(msg) {
  me = null; started = false;
  clearInterval(timer); clearInterval(statusTimer);
  showAuth("login", msg);
}
function showAuth(mode, msg = "") {
  $("#hdr").hidden = true;
  const setup = mode === "setup";
  view.innerHTML = `<div class="auth-wrap"><form class="auth-card" id="authf" autocomplete="on">
    <div class="logo"><span class="disc"></span>Crate</div>
    <h1>${setup ? "Create the admin account" : "Sign in"}</h1>
    <p class="sub" style="margin:0">${setup ? "This is the first time Crate has started. The account you create now is the admin: it can change settings, add users and install updates." : "Follow artists, get their albums."}</p>
    <label for="au">Username</label><input id="au" name="username" autocomplete="username" required ${setup ? 'minlength="2"' : ""} autofocus>
    <label for="ap">Password</label><input id="ap" name="password" type="password" autocomplete="${setup ? "new-password" : "current-password"}" required ${setup ? 'minlength="6"' : ""}>
    ${setup ? `<label for="ap2">Confirm password</label><input id="ap2" type="password" autocomplete="new-password" required>` : ""}
    <button class="btn primary" type="submit">${setup ? "Create admin & continue" : "Sign in"}</button>
    <div class="auth-err" id="aerr">${esc(msg)}</div>
  </form></div>`;
  $("#authf").onsubmit = async e => {
    e.preventDefault();
    const err = $("#aerr"), btn = e.target.querySelector("button");
    err.textContent = "";
    if (setup && $("#ap").value !== $("#ap2").value) { err.textContent = "The passwords don't match."; return; }
    btn.disabled = true;
    try {
      me = await api(setup ? "/api/setup" : "/api/login", { method: "POST", noRedirect: true, body: { username: $("#au").value.trim(), password: $("#ap").value } });
      startApp();
    } catch (x) { err.textContent = x.message; btn.disabled = false; }
  };
}
function renderUserMenu() {
  $("#umenu").hidden = false;
  $("#uav").textContent = (me.username[0] || "?").toUpperCase();
  $("#uname").textContent = me.username;
  document.querySelectorAll("[data-admin]").forEach(a => a.hidden = !isAdmin());
  const conn = $("#conn");
  if (isAdmin()) conn.setAttribute("href", "#/settings"); else conn.removeAttribute("href");
}
function openUserMenu() {
  const d = $("#udrop");
  if (!d.hidden) { d.hidden = true; return; }
  const lim = me.role !== "admin" && me.daily_limit ? `<div style="margin-top:6px">${me.requested_today} of ${me.daily_limit} albums requested today</div>` : "";
  d.innerHTML = `<div class="who"><b>${esc(me.username)}</b>${me.role === "admin" ? "Admin" : "User"}${lim}</div>
    <button id="mpw">Change password</button>
    ${isAdmin() ? `<a href="#/settings/users" id="musers">Manage users</a>` : ""}
    <button id="mout">Sign out</button>`;
  d.hidden = false;
  $("#mout").onclick = async () => { d.hidden = true; await api("/api/logout", { method: "POST", noRedirect: true }).catch(() => {}); signedOut(""); };
  if ($("#musers")) $("#musers").onclick = () => { d.hidden = true; };
  $("#mpw").onclick = () => {
    d.innerHTML = `<div class="who"><b>Change password</b></div><form class="pwbox" id="pwf">
      <input type="password" id="pc" placeholder="Current password" autocomplete="current-password" required>
      <input type="password" id="pn" placeholder="New password (6+ characters)" autocomplete="new-password" minlength="6" required>
      <button class="btn primary sm" type="submit" style="width:auto">Save new password</button><div class="auth-err" id="pwe"></div></form>`;
    $("#pc").focus();
    $("#pwf").onsubmit = async e => {
      e.preventDefault();
      try { await api("/api/me/password", { method: "POST", body: { current: $("#pc").value, new: $("#pn").value } }); d.hidden = true; toast("Password changed. Other devices were signed out."); }
      catch (x) { $("#pwe").textContent = x.message; }
    };
  };
}
document.addEventListener("click", e => {
  if (e.target.closest("#ubtn")) return openUserMenu();
  if (!e.target.closest("#udrop")) { const d = $("#udrop"); if (d) d.hidden = true; }
});
function startApp() {
  $("#hdr").hidden = false;
  renderUserMenu();
  if (started) return go();
  started = true;
  refreshStatus().then(go);
  statusTimer = setInterval(() => { if (!document.hidden && me) refreshStatus(); }, 5000);
}
async function boot() {
  let s = null;
  try { s = await (await fetch("/api/setup-needed")).json(); }
  catch { view.innerHTML = `<div class="blank"><div class="big">Can't reach Crate</div>Check that it's running, then reload.</div>`; return; }
  if (s.needed) return showAuth("setup");
  try { me = await api("/api/me", { noRedirect: true }); } catch { return showAuth("login"); }
  startApp();
}
window.addEventListener("hashchange", () => { if (me) go(); });
boot();
</script>
