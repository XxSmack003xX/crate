# Crate on its own, using an slskd you already run (in Docker, natively, or on
# another machine).
#
#   cp .env.example .env          # set SLSKD_URL, SLSKD_API_KEY, DOWNLOADS_DIR, MUSIC_DIR
#   mkdir -p crate-data
#   docker compose -f docker-compose.existing-slskd.yml up -d
#
#   Crate → http://localhost:9325 (CRATE_PORT)
#
# The important part: DOWNLOADS_DIR must be the *host* folder your slskd saves
# finished downloads to, so Crate can see the files and move them into MUSIC_DIR.

services:
  crate:
    # Prebuilt image, updated with:  docker compose pull && docker compose up -d
    # Pin a version with CRATE_VERSION in .env (e.g. 1.1.0); default is latest.
    image: ghcr.io/xxsmack003xx/crate:${CRATE_VERSION:-latest}
    # To build from source instead, uncomment the next line and run: docker compose up -d --build
    # build: .
    container_name: crate
    init: true
    environment:
      # Crate runs as this user/group (the container starts as root only to set that up).
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Lets one-click updates find this container; keep it equal to container_name.
      - CRATE_CONTAINER_NAME=crate
      # Optional: create the first admin automatically instead of using the setup screen.
      - CRATE_ADMIN_USER=${CRATE_ADMIN_USER:-}
      - CRATE_ADMIN_PASSWORD=${CRATE_ADMIN_PASSWORD:-}
      - CRATE_SLSKD_URL=${SLSKD_URL:-http://host.docker.internal:5030}
      - CRATE_SLSKD_API_KEY=${SLSKD_API_KEY:?set SLSKD_API_KEY in .env}
      - CRATE_SLSKD_DOWNLOADS_DIR=/downloads
      - CRATE_LIBRARY_DIR=/music
      - CRATE_MB_CONTACT=${MB_CONTACT:-crate-self-hosted}
    volumes:
      - ./crate-data:/data
      - ${DOWNLOADS_DIR:?set DOWNLOADS_DIR in .env}:/downloads
      - ${MUSIC_DIR:?set MUSIC_DIR in .env}:/music
      # One-click updates (Settings → Updates): lets Crate replace its own container.
      # WARNING: access to the Docker socket is effectively root on this machine.
      # Remove this line to turn in-app updates off (then use docker compose pull).
      - ${DOCKER_SOCKET_HOST:-/var/run/docker.sock}:/var/run/docker.sock
    ports:
      - "${CRATE_PORT:-9325}:9325"
    # Lets http://host.docker.internal reach slskd on this machine (needed on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # If slskd runs in another compose project, you can join its network instead and
    # set SLSKD_URL=http://slskd:5030. Find the network name with `docker network ls`.
    # networks: [slskd_net]

# networks:
#   slskd_net:
#     external: true
#     name: slskd_default
