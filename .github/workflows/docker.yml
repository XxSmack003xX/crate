# Builds the Crate Docker image and publishes it to GitHub Container Registry:
#   ghcr.io/xxsmack003xx/crate
#
#   push to main      → :latest, :main, :sha-<short>
#   release v1.2.3    → :1.2.3, :1.2, :1, :latest
#
# Users update with:  docker compose pull && docker compose up -d
name: Docker image

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        env:
          CRATE_UPDATE_CHECKS: "false"
        run: |
          python tests/test_e2e.py
          python tests/test_dupes.py
          python tests/test_import.py
          python tests/test_song_dupes.py
          python tests/test_slskd_roles.py
          python tests/test_auth.py
          python tests/test_updater.py
          python tests/test_rules.py
          python tests/test_import_files.py

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' }}
            type=ref,event=branch
            type=sha,format=short,enable=${{ github.event_name != 'release' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Crate
            org.opencontainers.image.description=Follow music artists and download their discographies through slskd

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
